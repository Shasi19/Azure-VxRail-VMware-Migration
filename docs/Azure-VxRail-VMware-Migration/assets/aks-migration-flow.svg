  <text x="795" y="298" font-family="Arial" font-size="17" fill="white">72-hour canary</text>
  <text x="795" y="331" font-family="Arial" font-size="17" fill="white">CAB + exec approval</text>
  <text x="1150" y="225" font-family="Arial" font-size="26" font-weight="700" fill="white">OPERATE</text>
  <text x="1125" y="265" font-family="Arial" font-size="17" fill="white">Monitor SLOs</text>
  <text x="1125" y="298" font-family="Arial" font-size="17" fill="white">Immutable backup</text>
