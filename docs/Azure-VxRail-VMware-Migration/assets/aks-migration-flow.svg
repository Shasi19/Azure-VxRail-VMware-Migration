<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520">
  <rect width="1400" height="520" fill="#f7f3ed"/>
  <text x="60" y="60" font-family="Arial" font-size="30" font-weight="700" fill="#14213d">Environment-gated migration flow</text>
  <text x="60" y="94" font-family="Arial" font-size="17" fill="#53606e">Each environment earns the next migration gate through testing, backup restore, and business sign-off.</text>
  <rect x="70" y="180" width="260" height="180" rx="12" fill="#e07a5f"/>
  <rect x="410" y="180" width="260" height="180" rx="12" fill="#3d9970"/>
  <rect x="750" y="180" width="260" height="180" rx="12" fill="#e0a458"/>
  <rect x="1090" y="180" width="240" height="180" rx="12" fill="#14213d"/>
  <text x="170" y="225" font-family="Arial" font-size="26" font-weight="700" fill="white">QA</text>
  <text x="120" y="265" font-family="Arial" font-size="17" fill="white">Restore + smoke test</text>
  <text x="120" y="298" font-family="Arial" font-size="17" fill="white">6 nodes Ready</text>
  <text x="120" y="331" font-family="Arial" font-size="17" fill="white">200-user test</text>
  <text x="500" y="225" font-family="Arial" font-size="26" font-weight="700" fill="white">PREPROD</text>
  <text x="455" y="265" font-family="Arial" font-size="17" fill="white">HA + load + restore</text>
  <text x="455" y="298" font-family="Arial" font-size="17" fill="white">Patroni failover</text>
  <text x="455" y="331" font-family="Arial" font-size="17" fill="white">3,000-user gate</text>
  <text x="850" y="225" font-family="Arial" font-size="26" font-weight="700" fill="white">PROD</text>
